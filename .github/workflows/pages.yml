name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/party-website-redesign-1vvkyo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # aktiviert GitHub Pages beim ersten Lauf automatisch
          enablement: true
      # Statische Seite - kein Build-Schritt notwendig.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
